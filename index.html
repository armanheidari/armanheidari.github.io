<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arman Heidari | The Growing Cosmic Mind</title>
  <meta name="description"
    content="Arman Heidari - B.Sc. Graduate in Computer Engineering from Allameh Tabataba'i University passionate about AI, Machine Learning, Deep Learning, and Reinforcement Learning.">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Native Browser ES Module Import Map for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- WebGL Fullscreen Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Scroll Height Driver Container -->
  <div class="scroll-container"></div>

  <!-- 3D Floating Spatial Labels Layer -->
  <div id="spatial-labels-container"></div>

  <!-- Persistent HUD Layer -->
  <div id="hud-overlay">
    <!-- Brand Header -->
    <header class="brand-header">
      <h1 class="brand-title">Arman Heidari</h1>
      <span class="brand-badge">Cosmic Mind</span>
    </header>

    <!-- Stage Progress Indicator Dots -->
    <nav class="stage-indicator" aria-label="Journey Stages">
      <div class="stage-dot active" data-stage="1" data-label="Birth"></div>
      <div class="stage-dot" data-stage="2" data-label="Early Growth"></div>
      <div class="stage-dot" data-stage="3" data-label="Expansion"></div>
      <div class="stage-dot" data-stage="4" data-label="Projects"></div>
      <div class="stage-dot" data-stage="5" data-label="Present & Beyond"></div>
    </nav>
  </div>

  <!-- Hero Overlay Text (Stage 1) -->
  <div class="hero-overlay">
    <h2 class="hero-name">Arman Heidari</h2>
    <p class="hero-subtitle">
      B.Sc. Graduate in Computer Engineering from ATU
    </p>
    <div class="hero-tags">
      <span class="tag-pill">Artificial Intelligence</span>
      <span class="tag-pill">Machine Learning</span>
      <span class="tag-pill">Deep Learning</span>
      <span class="tag-pill">Reinforcement Learning</span>
      <span class="tag-pill">Python & C++</span>
    </div>
  </div>

  <!-- Initial Scroll Arrow Indicator (Critical Detail: Permanent Fadeout on Scroll) -->
  <div class="scroll-indicator">
    <span class="scroll-text">Scroll to explore</span>
    <svg class="scroll-arrow" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <!-- Floating 3D Glass Content Modal Cards Container -->
  <div id="modal-container" role="dialog" aria-modal="true">
    <div class="glass-modal">
      <button class="modal-close-btn" aria-label="Close modal">&times;</button>
      <div class="modal-category">Category</div>
      <h3 class="modal-title">Node Title</h3>
      <div class="modal-subtitle">Node Subtitle</div>
      <p class="modal-body">Node detailed content description goes here...</p>
      <ul class="modal-highlights"></ul>
      <div class="modal-tags"></div>
      <div class="modal-actions"></div>
    </div>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="js/scripts.js"></script>

</body>

</html>
