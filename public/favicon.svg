<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" stroke="url(#ring)" stroke-width="3" />
  <!-- Crisp bold AH monogram centered -->
  <text x="64" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">AH</text>
  <!-- Futuristic accent dot -->
  <circle cx="96" cy="34" r="5" fill="#38bdf8" />
</svg>
